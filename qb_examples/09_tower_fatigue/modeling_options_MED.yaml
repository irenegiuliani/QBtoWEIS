# Generic modeling options file to run standard WISDEM case
General:
    verbosity: False  

    qblade_configuration:
        flag: True
        path2qb_dll: r"C:\Users\Giuliani\Software\QBladeEE_2.0.9.5\QBladeEE_2.0.9.5.dll"
        QB_run_mod: MED-fatigue
        QB_run_dir: MED-fatigue
        qbtoweis_output_filter: QBtoWEIS_output_filter.txt
        number_of_workers: 3
        model_only: False
        
WISDEM:
    RotorSE:
        flag: True
        n_span: 101
        n_pitch_perf_surfaces: 20
        n_tsr_perf_surfaces: 20
        spar_cap_ss: Spar_Cap_SS        
        spar_cap_ps: Spar_Cap_PS
        te_ss: TE_reinforcement_SS
        te_ps: TE_reinforcement_PS
        peak_thrust_shaving: True
        thrust_shaving_coeff: 0.8
        n_sector: 8
        hubloss: true
        tiploss: true
        wakerotation: true
        usecd: true
    DriveSE:
        flag: True
    TowerSE:             
        flag: True
    BOS:
        flag: False
    FloatingSE:
        flag: True

TowerFatigue:
    flag: true
    profile: true
    n_theta: 36
    sn_model: linear
    design_life_years: 25.0
    section_fatigue_scf: 1.0
    fatigue_design_factor: 1.0
