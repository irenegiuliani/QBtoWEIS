      'generator.generator_mass_user',
      'drivese.nacelle_mass',
      'drivese.rna_mass',
      'aeroelastic_qblade.Max_MoorLineTension1',
      'aeroelastic_qblade.Max_MoorLineTension2',
      'aeroelastic_qblade.Max_MoorLineTension3',
      'floatingse.platform_mass', 
