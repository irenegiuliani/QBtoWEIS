general:
    folder_output: opt_output
    fname_output: fatigue_output


design_variables:

    tower:
        outer_diameter:
            flag: True
            lower_bound: 6.0
            upper_bound: 10.0
        layer_thickness:
            flag: True
            lower_bound: 0.005
            upper_bound: 0.10

merit_figure: tower_mass  # Merit figure of the optimization problem. The options are 'AEP' - 'LCOE' - 'Cp' - 'blade_mass' - 'blade_tip_deflection'

constraints:
  tower:
    stress:
      flag: True
    global_buckling:
      flag: True
    shell_buckling:
      flag: True
    d_to_t:
      flag: True
      lower_bound: 80.0
      upper_bound: 300.0
    taper:
      flag: True
      lower_bound: 0.5
    slope:
      flag: True
    thickness_slope:
      flag: True
    frequency_1:
      flag: True
      lower_bound: 0.4536 #+ 20% su 3P
      upper_bound: 0.600 
  damage:
    tower_fatigue:
      flag: true
      max: 1.0

driver:
  optimization:
    flag: True
    tol: 1.e-3            # Optimality tolerance
    max_iter: 1           # Maximum number of iterations (SLSQP)
    solver: LN_COBYLA     # Optimization solver. Other options are 'SLSQP' - 'CONMIN'
    
recorder:
    flag: True              # Flag to activate OpenMDAO recorder
    file_name: log_iea22mw_umaine.sql  # Name of OpenMDAO recorder
    includes: ['floatingse.platform_mass', 'aeroelastic_qblade.tower_fatigue_damage_25y']
