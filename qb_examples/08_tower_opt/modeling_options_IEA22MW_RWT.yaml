# Generic modeling options file to run standard WISDEM case
General:
    verbosity: False  # When set to True, the code prints to screen many infos

    qblade_configuration:
        flag: True
        QB_run_mod: IEA22MW_D15_out
        QB_run_dir: IEA22MW_D15_out
        qbtoweis_output_filter: QBtoWEIS_output_filter.txt
        number_of_workers: 6
        model_only: False
        
WISDEM:
    RotorSE:
        flag: True
        n_span: 51
        n_pitch_perf_surfaces: 10
        n_tsr_perf_surfaces: 10
        spar_cap_ss: Spar_Cap_SS        #guardare nome nel file yaml 
        spar_cap_ps: Spar_Cap_PS
        te_ss: TE_reinforcement_SS
        te_ps: TE_reinforcement_PS
        peak_thrust_shaving: True
        thrust_shaving_coeff: 0.85
        n_sector: 8
        hubloss: true
        tiploss: true
        wakerotation: true
        usecd: true
    DriveSE:
        flag: True
    TowerSE:             # Options of TowerSE module
        flag: True
    BOS:
        flag: False
    FloatingSE:
        flag: true
        
